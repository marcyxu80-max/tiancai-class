<!DOCTYPE html>

<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 天才培训班</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --primary: #4CAF50;
            --primary-hover: #45a049;
            --text: #e0e0e0;
            --text-light: #aaa;
            --accent: #f5c518;
            --error: #e74c3c;
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "微软雅黑", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            padding: 40px;
            max-width: 420px;
            width: 100%;
            animation: slideUp 0.6s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(245, 197, 24, 0.2);
        }

        .title .emoji {
            font-size: 32px;
            display: block;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            color: var(--text);
            margin-bottom: 10px;
            font-weight: bold;
        }

        .form-group input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.2);
        }

        .form-group input[type="number"]::placeholder {
            color: var(--text-light);
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 10px 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: all 0.3s;
            flex: 1;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
        }

        .radio-item:hover {
            border-color: var(--primary);
            background: rgba(76, 175, 80, 0.1);
        }

        .radio-item.selected {
            border-color: var(--primary);
            background: rgba(76, 175, 80, 0.15);
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.15);
        }

        .radio-item input[type="radio"] {
            display: none;
        }

        .radio-item .radio-circle {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-light);
            border-radius: 50%;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .radio-item.selected .radio-circle {
            border-color: var(--primary);
        }

        .radio-item.selected .radio-circle::after {
            content: "";
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .radio-item span {
            font-size: 16px;
            color: var(--text);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), #2e7d32);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            color: var(--accent);
            font-size: 16px;
            line-height: 1.8;
            display: none;
            animation: fadeIn 0.5s ease;
            border: 1px solid rgba(245, 197, 24, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .result.show {
            display: block;
        }

        .error {
            color: var(--error);
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .error.show {
            display: block;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: var(--text-light);
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .card { padding: 25px; }
            .title { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">
            <span class="emoji">🎓</span>
            欢迎来到天才培训班！
        </div>

        <div class="form-group">
            <label>📋 请问你几岁？</label>
            <input type="number" id="ageInput" placeholder="输入你的年龄..." min="1" max="200">
            <div class="error" id="ageError">⚠️ 请先输入年龄！</div>
        </div>

        <div class="form-group">
            <label>🧮 你会做算数吗？</label>
            <div class="radio-group">
                <div class="radio-item selected" onclick="selectRadio(this, &#39;会&#39;)">
                    <input type="radio" name="math" value="会" checked="">
                    <div class="radio-circle"></div>
                    <span>会</span>
                </div>
                <div class="radio-item" onclick="selectRadio(this, &#39;不会&#39;)">
                    <input type="radio" name="math" value="不会">
                    <div class="radio-circle"></div>
                    <span>不会</span>
                </div>
            </div>
        </div>

        <button class="submit-btn" onclick="submit()">☑️ 提交</button>

        <div class="result" id="result"></div>

        <div class="footer">🦊 天才培训班 · 专治各种不服</div>
    </div>

    <script>
        let mathValue = "会";

        function selectRadio(el, value) {
            document.querySelectorAll('.radio-item').forEach(item => {
                item.classList.remove('selected');
            });
            el.classList.add('selected');
            el.querySelector('input').checked = true;
            mathValue = value;
        }

        function submit() {
            const age = document.getElementById('ageInput').value;
            const ageError = document.getElementById('ageError');
            const result = document.getElementById('result');

            ageError.classList.remove('show');
            result.classList.remove('show');

            if (!age) {
                ageError.classList.add('show');
                return;
            }

            let msg = "";
            if (mathValue === "会") {
                msg = `🎉 哇，<strong>${age}岁</strong>，你好厉害！<br>太好了！我们有一堆试卷等你来做。<br><br>💰 <strong>快去交钱！</strong>`;
            } else {
                msg = `🎉 哇，<strong>${age}岁</strong>，你好厉害！<br>太好了，我们可以教你。<br><br>💰 <strong>快去交钱！</strong>`;
            }

            setTimeout(() => {
                result.innerHTML = msg;
                result.classList.add('show');
            }, 200);
        }

        document.getElementById('ageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submit();
        });
    </script>

</body></html>
